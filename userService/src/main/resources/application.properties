spring.application.name=userService
server.port=8081

# Default to dev profile locally. Override with SPRING_PROFILES_ACTIVE in production.
spring.profiles.active=dev

spring.grpc.server.port=9091

# PostgreSQL
spring.datasource.url=${USER_DB_URL}
spring.datasource.username=${USER_DB_USERNAME}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT – hämtar public key från Auth Service
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVICE_ISSUER_URI}