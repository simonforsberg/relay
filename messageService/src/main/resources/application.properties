spring.application.name=messageService
server.port=8082

# Default to dev profile locally. Override with SPRING_PROFILES_ACTIVE in production.
spring.profiles.active=dev

spring.grpc.client.channels.userService.address=${USER_SERVICE_GRPC_ADDRESS}
spring.grpc.client.channels.userService.negotiation-type=plaintext

# PostgreSQL
spring.datasource.url=${MESSAGE_DB_URL}
spring.datasource.username=${MESSAGE_DB_USERNAME}
spring.datasource.password=${MESSAGE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT – hämtar public key från Auth Service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVICE_JWK_URI}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# OAuth2 client credentials för service-to-service
spring.security.oauth2.client.registration.authservice.client-id=service-client
spring.security.oauth2.client.registration.authservice.client-secret=${AUTH_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.authservice.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.authservice.scope=user.read

spring.security.oauth2.client.provider.authservice.token-uri=${AUTH_SERVICE_TOKEN_URI}