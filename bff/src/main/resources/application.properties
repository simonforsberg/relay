spring.application.name=bff
server.port=8080

spring.profiles.active=dev

bff.post-logout-redirect-uri=${BFF_BASE_URL}

services.user-service.base-url=${USER_SERVICE_URL}
services.message-service.base-url=${MESSAGE_SERVICE_URL}

spring.security.oauth2.client.provider.authservice.issuer-uri=${AUTH_SERVICE_ISSUER_URI}
spring.security.oauth2.client.registration.authservice.client-id=${BFF_CLIENT_ID}
spring.security.oauth2.client.registration.authservice.client-secret=${BFF_CLIENT_SECRET}
spring.security.oauth2.client.registration.authservice.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.authservice.redirect-uri=${BFF_REDIRECT_URI}
spring.security.oauth2.client.registration.authservice.scope=user.read,openid