bff.post-logout-redirect-uri=http://localhost:8080/

services.user-service.base-url=http://localhost:8081
services.message-service.base-url=http://localhost:8082

spring.security.oauth2.client.provider.authservice.issuer-uri=http://127.0.0.1:9000
spring.security.oauth2.client.registration.authservice.client-id=gateway-client
spring.security.oauth2.client.registration.authservice.client-secret=secret
spring.security.oauth2.client.registration.authservice.redirect-uri=http://localhost:8080/login/oauth2/code/authservice
