<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Relay Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0e0f11;
            --surface: #16181c;
            --border: #2a2d33;
            --accent: #4ade80;
            --accent2: #86efac;
            --muted: #6b7280;
            --text: #e5e7eb;
            --radius: 6px;
            --mono: 'IBM Plex Mono', monospace;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
        }

        /* ── Utilities ── */
        .hidden { display: none !important; }

        /* ── Header ── */
        header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .logo {
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        header .status {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            margin-left: auto;
            margin-right: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        header .status .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .hdr-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.7rem;
            padding: 5px 10px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }
        .hdr-btn.active { border-color: var(--accent); color: var(--accent); }

        /* ── Main ── */
        main {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Chat view ── */
        #chat-view {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Filter bar ── */
        #filter-bar {
            padding: 7px 24px;
            background: #0f2b15;
            border-bottom: 1px solid #166534;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--accent2);
        }

        #filter-bar span { flex: 1; }

        #clear-filter-btn {
            background: transparent;
            border: 1px solid #166534;
            border-radius: var(--radius);
            color: var(--accent2);
            font-family: var(--mono);
            font-size: 0.68rem;
            padding: 3px 8px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        #clear-filter-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Message list ── */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #messages:empty::after {
            content: 'No messages.';
            color: var(--muted);
            font-size: 0.85rem;
            font-family: var(--mono);
            align-self: center;
            margin: auto;
        }

        .msg {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            max-width: 72%;
            width: fit-content;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

        .msg.own { align-self: flex-end; border-color: #2a3d30; background: #131f16; }

        .msg .sender {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--accent);
            margin-bottom: 4px;
            text-transform: lowercase;
        }

        .msg.own .sender { color: var(--accent2); }

        .msg .sender.clickable { cursor: pointer; text-decoration: underline dotted; }
        .msg .sender.clickable:hover { color: var(--accent2); }

        .msg .body { font-size: 0.9rem; line-height: 1.5; }

        .msg .ts {
            font-family: var(--mono);
            font-size: 0.6rem;
            color: var(--muted);
            margin-top: 4px;
            text-align: right;
        }

        /* ── Users view ── */
        #users-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-bar { display: flex; gap: 8px; }

        .search-bar input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.85rem;
            padding: 8px 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-bar input:focus { border-color: var(--accent); }
        .search-bar input::placeholder { color: var(--muted); }

        .user-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

        .user-table th {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--muted);
            text-align: left;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
        }

        .user-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .user-table tr:last-child td { border-bottom: none; }
        .user-table td:last-child { text-align: right; }
        .user-table .mono { font-family: var(--mono); font-size: 0.8rem; }
        .user-table .muted { color: var(--muted); }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.7rem;
            padding: 4px 10px;
            cursor: pointer;
            margin-right: 4px;
            transition: border-color 0.15s, color 0.15s;
        }

        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .action-btn.delete-btn:hover { border-color: #ef4444; color: #ef4444; }

        .empty-state {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.85rem;
            text-align: center;
            padding: 40px 0;
        }

        /* ── Compose area ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.9rem;
            padding: 10px 14px;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.15s;
        }

        #input:focus { border-color: var(--accent); }
        #input::placeholder { color: var(--muted); }

        #send-btn {
            background: var(--accent);
            color: #0a1a0d;
            border: none;
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 10px 18px;
            cursor: pointer;
            height: 42px;
            transition: background 0.15s, opacity 0.15s;
        }

        #send-btn:hover { background: var(--accent2); }
        #send-btn:active { opacity: 0.75; }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── Edit modal ── */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title { font-family: var(--mono); font-size: 0.9rem; color: var(--accent); }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover { color: var(--text); }

        #edit-form { display: flex; flex-direction: column; gap: 10px; }

        #edit-form input {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.85rem;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        #edit-form input:focus { border-color: var(--accent); }
        #edit-form input::placeholder { color: var(--muted); }

        .form-error { font-family: var(--mono); font-size: 0.72rem; color: #fca5a5; min-height: 1em; }

        .modal-buttons { display: flex; gap: 8px; }

        .btn-save {
            flex: 1;
            background: var(--accent);
            color: #0a1a0d;
            border: none;
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 9px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-save:hover { background: var(--accent2); }
        .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.8rem;
            padding: 9px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .btn-cancel:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Toast ── */
        #toast {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--mono);
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: var(--radius);
            z-index: 99;
            white-space: nowrap;
        }

        #toast.show { display: block; animation: fadeIn 0.2s ease; }
        #toast.error { background: #3b1212; border: 1px solid #7f1d1d; color: #fca5a5; }
        #toast.success { background: #0f2b15; border: 1px solid #166534; color: #86efac; }
    </style>
</head>
<body>

<header>
    <div class="logo">relay/</div>
    <div class="status">
        <span class="dot"></span>
        <span id="who"></span>
    </div>
    <button id="users-toggle-btn" class="hdr-btn">show all users</button>
    <form action="/logout" method="post">
        <button type="submit" class="hdr-btn">log out</button>
    </form>
</header>

<main>
    <!-- Chat view (default) -->
    <div id="chat-view">
        <div id="filter-bar" class="hidden">
            <span>showing messages from <strong id="filter-name"></strong></span>
            <button id="clear-filter-btn">✕ clear filter</button>
        </div>
        <div id="messages"></div>
    </div>

    <!-- Users view / Search view -->
    <div id="users-view" class="hidden">
        <div class="search-bar">
            <input id="search-input" type="text" placeholder="search by username or e-mail..."/>
            <button id="search-btn" class="action-btn">search</button>
            <button id="clear-btn" class="action-btn">clear</button>
        </div>
        <div id="users-list"></div>
    </div>
</main>

<footer id="compose">
    <textarea id="input" placeholder="Write a message…" rows="1"></textarea>
    <button id="send-btn">send</button>
</footer>

<!-- Edit modal -->
<div id="modal-overlay" class="hidden">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title">edit user</span>
            <button class="modal-close" id="modal-close-btn">✕</button>
        </div>
        <form id="edit-form">
            <input id="edit-username" type="text" placeholder="username" required/>
            <input id="edit-email" type="email" placeholder="email" required/>
            <input id="edit-password" type="password" placeholder="new password (min. 8 characters)"
                   minlength="8" required/>
            <div id="edit-error" class="form-error"></div>
            <div class="modal-buttons">
                <button type="submit" id="edit-submit-btn" class="btn-save">save</button>
                <button type="button" id="modal-cancel-btn" class="btn-cancel">cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="toast"></div>

<script>
    // ── State ──────────────────────────────────────────────────────────────
    let currentUser = null;
    let allMessages = [];
    let senderFilter = null; // { id, username } or null
    let editingUserId = null;

    // ── Init ───────────────────────────────────────────────────────────────
    async function init() {
        try {
            const res = await fetch('/api/users/me');
            if (res.status === 401 || res.redirected) {
                window.location.href = '/';
                return;
            }
            if (!res.ok) throw new Error(res.status);
            currentUser = await res.json();
            document.getElementById('who').textContent = currentUser.username;
        } catch (e) {
            showError('Could not fetch user: ' + e.message);
            return;
        }
        await loadMessages();
    }

    function handleResponse(res) {
        if (res.status === 401 || res.redirected) {
            window.location.href = '/';
            return false;
        }
        return true;
    }

    // ── View toggle ────────────────────────────────────────────────────────
    document.getElementById('users-toggle-btn').addEventListener('click', () => {
        const chatView = document.getElementById('chat-view');
        const usersView = document.getElementById('users-view');
        const compose = document.getElementById('compose');
        const btn = document.getElementById('users-toggle-btn');
        const inChat = !chatView.classList.contains('hidden');

        if (inChat) {
            chatView.classList.add('hidden');
            usersView.classList.remove('hidden');
            compose.classList.add('hidden');
            btn.classList.add('active');
            btn.textContent = 'back to chat';
            loadUsers();
        } else {
            chatView.classList.remove('hidden');
            usersView.classList.add('hidden');
            compose.classList.remove('hidden');
            btn.classList.remove('active');
            btn.textContent = 'show all users';
        }
    });

    // ── Messages ───────────────────────────────────────────────────────────
    async function loadMessages() {
        try {
            const res = await fetch('/api/messages');
            if (!handleResponse(res)) return;
            if (!res.ok) throw new Error(res.status);
            allMessages = await res.json();
            renderMessages();
        } catch (e) {
            showError('Could not fetch messages: ' + e.message);
        }
    }

    function renderMessages() {
        const list = document.getElementById('messages');
        const visible = senderFilter
            ? allMessages.filter(m => m.senderId === senderFilter.id)
            : allMessages;
        list.innerHTML = '';
        visible.forEach(m => renderMessage(m, false));
        list.scrollTop = list.scrollHeight;

        const bar = document.getElementById('filter-bar');
        if (senderFilter) {
            document.getElementById('filter-name').textContent = senderFilter.username;
            bar.classList.remove('hidden');
        } else {
            bar.classList.add('hidden');
        }
    }

    function renderMessage(msg, scroll = true) {
        const list = document.getElementById('messages');
        const isOwn = msg.senderId === currentUser?.id || msg.senderUsername === currentUser?.username;
        const div = document.createElement('div');
        div.className = 'msg' + (isOwn ? ' own' : '');

        const senderName = msg.senderUsername ?? msg.senderId ?? 'unknown';

        const senderEl = document.createElement('div');
        senderEl.className = 'sender' + (!isOwn ? ' clickable' : '');
        senderEl.textContent = senderName;
        if (!isOwn) {
            senderEl.title = `Filter by ${senderName}`;
            senderEl.addEventListener('click', () => filterBySender(msg.senderId, senderName));
        }

        const bodyEl = document.createElement('div');
        bodyEl.className = 'body';
        bodyEl.textContent = msg.content ?? '';

        div.appendChild(senderEl);
        div.appendChild(bodyEl);

        if (msg.createdAt) {
            const tsEl = document.createElement('div');
            tsEl.className = 'ts';
            tsEl.textContent = new Date(msg.createdAt).toLocaleString('sv-SE', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
            div.appendChild(tsEl);
        }

        list.appendChild(div);
        if (scroll) list.scrollTop = list.scrollHeight;
    }

    function filterBySender(id, username) {
        senderFilter = {id, username};
        renderMessages();
    }

    function clearFilter() {
        senderFilter = null;
        renderMessages();
    }

    document.getElementById('clear-filter-btn').addEventListener('click', clearFilter);

    async function sendMessage() {
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        try {
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: text})
            });
            if (!handleResponse(res)) return;
            if (!res.ok) throw new Error(res.status);
            const msg = await res.json();
            allMessages.push(msg);
            input.value = '';
            input.style.height = 'auto';
            if (!senderFilter || senderFilter.id === msg.senderId) {
                renderMessage(msg, true);
            }
        } catch (e) {
            showError('Could not send: ' + e.message);
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    document.getElementById('input').addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    document.getElementById('input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    document.getElementById('send-btn').addEventListener('click', sendMessage);

    // ── Users ──────────────────────────────────────────────────────────────
    async function loadUsers() {
        try {
            const res = await fetch('/api/users');
            if (!handleResponse(res)) return;
            if (!res.ok) throw new Error(res.status);
            renderUsers(await res.json());
        } catch (e) {
            showError('Could not load users: ' + e.message);
        }
    }

    function renderUsers(users) {
        const container = document.getElementById('users-list');
        if (users.length === 0) {
            container.innerHTML = '<p class="empty-state">No users found.</p>';
            return;
        }

        const table = document.createElement('table');
        table.className = 'user-table';
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th>username</th><th>email</th><th>joined</th><th></th></tr>';
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        users.forEach(user => {
            const tr = document.createElement('tr');

            const tdUser = document.createElement('td');
            tdUser.className = 'mono';
            tdUser.textContent = user.username;

            const tdEmail = document.createElement('td');
            tdEmail.textContent = user.email ?? '—';

            const tdJoined = document.createElement('td');
            tdJoined.className = 'mono muted';
            tdJoined.textContent = user.createdAt
                ? new Date(user.createdAt).toLocaleDateString('sv-SE')
                : '—';

            const tdActions = document.createElement('td');

            const editBtn = document.createElement('button');
            editBtn.className = 'action-btn';
            editBtn.textContent = 'edit';
            editBtn.addEventListener('click', () => openEditModal(user));

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-btn delete-btn';
            deleteBtn.textContent = 'delete';
            deleteBtn.addEventListener('click', () => deleteUser(user.id, user.username));

            tdActions.appendChild(editBtn);
            tdActions.appendChild(deleteBtn);
            tr.append(tdUser, tdEmail, tdJoined, tdActions);
            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        container.innerHTML = '';
        container.appendChild(table);
    }

    async function searchUser() {
        const searchterm = document.getElementById('search-input').value.trim();
        if (!searchterm) return;
        try {
            if (searchterm.includes('@')){
                const r1 = await fetch(`/api/users/by-email?email=${encodeURIComponent(searchterm)}`);
                if (r1.status === 404) {
                    renderUsers([]);
                    return;
                }
                renderUsers([await r1.json()]);
            }
            else {  // by-username returns only id+username; follow up with GET by ID for full profile
                const r1 = await fetch(`/api/users/by-username?username=${encodeURIComponent(searchterm)}`);
                if (r1.status === 404) {
                    renderUsers([]);
                    return;
                }
                if (!handleResponse(r1)) return;
                const partial = await r1.json();

                const r2 = await fetch(`/api/users/${partial.id}`);
                if (!handleResponse(r2)) return;
                if (!r2.ok) throw new Error(r2.status);
                renderUsers([await r2.json()]);
            }
        } catch (e) {
            showError('Search failed: ' + e.message);
        }
    }

    async function deleteUser(id, username) {
        if (!confirm(`Delete "${username}"? This cannot be undone.`)) return;
        try {
            const res = await fetch(`/api/users/${id}`, {method: 'DELETE'});
            if (!handleResponse(res)) return;
            if (!res.ok) throw new Error(res.status);
            showSuccess(`"${username}" deleted.`);
            loadUsers();
        } catch (e) {
            showError('Delete failed: ' + e.message);
        }
    }

    // ── Edit modal ─────────────────────────────────────────────────────────
    function openEditModal(user) {
        editingUserId = user.id;
        document.getElementById('edit-username').value = user.username;
        document.getElementById('edit-email').value = user.email;
        document.getElementById('edit-password').value = '';
        document.getElementById('edit-error').textContent = '';
        document.getElementById('modal-overlay').classList.remove('hidden');
        document.getElementById('edit-username').focus();
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
        editingUserId = null;
    }

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.getElementById('edit-form').addEventListener('submit', async e => {
        e.preventDefault();
        if (!editingUserId) return;

        const btn = document.getElementById('edit-submit-btn');
        const errEl = document.getElementById('edit-error');
        errEl.textContent = '';
        btn.disabled = true;

        try {
            const res = await fetch(`/api/users/${editingUserId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('edit-username').value.trim(),
                    email: document.getElementById('edit-email').value.trim(),
                    password: document.getElementById('edit-password').value
                })
            });
            if (!handleResponse(res)) return;
            if (res.ok) {
                closeModal();
                showSuccess('User updated.');
                loadUsers();
            } else {
                errEl.textContent = await res.text() || 'Update failed.';
            }
        } catch {
            errEl.textContent = 'Could not reach the server.';
        } finally {
            btn.disabled = false;
        }
    });

    // ── Search wiring ──────────────────────────────────────────────────────
    document.getElementById('search-btn').addEventListener('click', searchUser);
    document.getElementById('search-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') searchUser();
    });
    document.getElementById('clear-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        loadUsers();
    });

    // ── Toast ──────────────────────────────────────────────────────────────
    function showToast(msg, type) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `${type} show`;
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showError(msg) { showToast(msg, 'error'); }
    function showSuccess(msg) { showToast(msg, 'success'); }

    init();
</script>
</body>
</html>
